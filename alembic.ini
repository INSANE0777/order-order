# Alembic's entry point. The environment itself lives inside the package, at
# `src/orderorder/migrations`, so that it ships in the wheel and is present in the container: a
# migration you cannot run on the box you deployed to is not a migration.
#
# There is no `sqlalchemy.url` here on purpose. The database is chosen by `DATABASE_URL` through
# `orderorder.config`, and a second copy of that decision in an ini file is a second thing to get
# wrong -- the classic version of which is running a migration against the developer's SQLite while
# believing it went to production. `env.py` asks the application.

[alembic]
script_location = src/orderorder/migrations
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
